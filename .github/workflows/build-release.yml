# GitHub Actions Workflow: Build & Release Anki Add-on Archive
name: Build & Release Anki Add-on

# Triggers: Runs on pushes to main branch, pull requests, version tags, or manual invocation
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish_ankiweb:
        description: 'Publish add-on to AnkiWeb (requires ANKIWEB_USERNAME & ANKIWEB_PASSWORD secrets)'
        required: false
        type: boolean
        default: false

# Grant write permissions for contents to allow release creation
permissions:
  contents: write

jobs:
  build:
    name: Build .ankiaddon Package
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Step 2: Set up Python 3.11 environment
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      # Step 3: Run Python packaging script to create dist/recall_raters.ankiaddon
      - name: Package Anki Add-on
        run: |
          # Execute build script to create .ankiaddon zip archive
          python3 scripts/build_addon.py

      # Step 4: Upload build artifact so it can be downloaded from Action summary
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: recall_raters.ankiaddon
          path: dist/recall_raters.ankiaddon

  release:
    name: Create GitHub Release
    needs: build
    # Only run release creation when pushing a version tag (e.g. v1.0.0)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Step 2: Download previously built artifact
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: recall_raters.ankiaddon
          path: dist

      # Step 3: Publish release to GitHub Releases with .ankiaddon asset
      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: dist/recall_raters.ankiaddon
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-ankiweb:
    name: Publish to AnkiWeb
    needs: build
    # Trigger AnkiWeb publication on version tag pushes or explicit manual workflow_dispatch invocation.
    # Depends directly on 'build' so manual dispatches can publish without requiring a GitHub release tag.
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_ankiweb == true)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository to access README.md for the AnkiWeb shared listing description
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Step 2: Download the compiled .ankiaddon archive produced by the build job
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: recall_raters.ankiaddon
          path: dist

      # Step 3: Fail fast with clear setup instructions if credentials have not been configured
      - name: Verify AnkiWeb Credentials
        env:
          # Bound to environment variables to avoid shell quotation breakage from special characters in credentials
          ANKIWEB_USER: ${{ secrets.ANKIWEB_USERNAME }}
          ANKIWEB_PASS: ${{ secrets.ANKIWEB_PASSWORD }}
        run: |
          if [ -z "$ANKIWEB_USER" ] || [ -z "$ANKIWEB_PASS" ]; then
            echo "::error::Missing AnkiWeb credentials! Please add ANKIWEB_USERNAME and ANKIWEB_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Step 4: Upload package to AnkiWeb shared add-on directory
      - name: Upload Add-on to AnkiWeb
        id: upload_ankiweb
        # Uses danny900714/upload-anki-addon to interact with AnkiWeb's protobuf upload endpoint
        uses: danny900714/upload-anki-addon@v1
        with:
          username: ${{ secrets.ANKIWEB_USERNAME }}
          password: ${{ secrets.ANKIWEB_PASSWORD }}
          # Support updating existing add-ons when an ID is stored, while omitting it on first publish to create a new entry
          addon-id: ${{ vars.ANKIWEB_ADDON_ID || secrets.ANKIWEB_ADDON_ID || '' }}
          title: "Recall Raters - Timer-Based Ease Disabler"
          tags: "timer rating fsrs ease speed review anti-cheat"
          support-page: "https://github.com/nikhilbadyal/recall-raters/issues"
          # Require 2.1.20 minimum (when gui_hooks was added to Anki); '+' marks forward-compatibility with future releases
          branches: "2.1.20-25.09.4+"
          addon-files: "dist/recall_raters.ankiaddon"
          description-file: "README.md"

      # Step 5: Print resulting listing ID and URL to workflow summary
      - name: Report Publication Details
        run: |
          # Log the registered add-on code to facilitate setting ANKIWEB_ADDON_ID for future updates
          echo "Anki add-on successfully uploaded to AnkiWeb!"
          echo "Add-on ID: ${{ steps.upload_ankiweb.outputs.addon-id }}"
          echo "Listing URL: https://ankiweb.net/shared/info/${{ steps.upload_ankiweb.outputs.addon-id }}"
