# GitHub Actions Workflow: Python Code Quality & Linting
name: Code Quality Checks

# Triggers: Run code linting on every push or pull request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint & Syntax Checks
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python 3.11 environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      # Step 3: Install flake8 syntax checker
      - name: Install Linting Tools
        run: |
          # Upgrade pip and install flake8 for python static analysis
          python -m pip install --upgrade pip
          pip install flake8

      # Step 4: Validate python files for syntax errors and undefined names
      - name: Lint with flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings (max line length 120)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
